<svg xmlns="http://www.w3.org/2000/svg" width="520" height="578" viewBox="0 0 520 578" role="img" aria-label="Profile info card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="55%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <rect width="520" height="578" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="519" height="577" rx="14"
        fill="none" stroke="#00f7ff" stroke-width="1" opacity="0.22"/>
  <g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
    <text x="26.0" y="57.0" font-size="25" fill="#e6f1f5" font-weight="bold" letter-spacing="1.6">ABIJITH G</text>
    <text x="26.0" y="77.5" font-size="10.5" fill="#00f7ff">AI/ML Engineer · Agentic Systems · Full-Stack</text>
    <line x1="26" y1="95.5" x2="494" y2="95.5" stroke="#274852" stroke-width="1" opacity="0.7"/>
    <text x="26.0" y="119.5" font-size="10" fill="#7d97a3">B.Tech CSE (AI/ML) · Presidency University</text>
    <text x="26.0" y="132.7" font-size="10" fill="#7d97a3">Bangalore, India</text>
    <text x="26.0" y="165.4" font-size="9.5" fill="#00f7ff" font-weight="bold" letter-spacing="2.4">HIGHLIGHTS</text>
    <text x="26.0" y="187.4" font-size="11" fill="#e6f1f5" font-weight="bold">▸ Seraph 2.0</text>
    <text x="40.0" y="199.0" font-size="8.6" fill="#7d97a3">Global autonomous compliance intelligence network. 12 agents in a synchronous layered</text>
    <text x="40.0" y="211.3" font-size="8.6" fill="#7d97a3">architecture, blockchain-backed traceability, real-time regulatory adaptation. 4th</text>
    <text x="40.0" y="223.5" font-size="8.6" fill="#7d97a3">place, Cardano IBW Hackathon India.</text>
    <text x="26.0" y="245.1" font-size="11" fill="#e6f1f5" font-weight="bold">▸ Sentinel</text>
    <text x="40.0" y="256.7" font-size="8.6" fill="#7d97a3">AI-supervised containerized dev environment. Docker-isolated workspaces, automated</text>
    <text x="40.0" y="268.9" font-size="8.6" fill="#7d97a3">provisioning, a monitoring agent that traces tool usage and emits safety reports.</text>
    <text x="26.0" y="290.5" font-size="11" fill="#e6f1f5" font-weight="bold">▸ AbiLang</text>
    <text x="40.0" y="302.1" font-size="8.6" fill="#7d97a3">Interpreted language built from scratch in Python — lexer, recursive-descent parser,</text>
    <text x="40.0" y="314.3" font-size="8.6" fill="#7d97a3">AST, runtime, REPL, CLI tooling, standalone packaging for .abi programs.</text>
    <text x="26.0" y="335.9" font-size="11" fill="#e6f1f5" font-weight="bold">▸ ISL Recognition</text>
    <text x="40.0" y="347.5" font-size="8.6" fill="#7d97a3">Transformer-based Indian Sign Language classifier, 85% accuracy via transfer learning</text>
    <text x="40.0" y="359.7" font-size="8.6" fill="#7d97a3">and augmentation on the Kaggle ISL dataset.</text>
    <text x="26.0" y="381.3" font-size="11" fill="#e6f1f5" font-weight="bold">▸ MIRA_C</text>
    <text x="40.0" y="392.9" font-size="8.6" fill="#7d97a3">Agent-based automotive fault detection. Real-time anomaly identification with OpenCV,</text>
    <text x="40.0" y="405.2" font-size="8.6" fill="#7d97a3">regression and classification models for diagnostic routing.</text>
    <text x="26.0" y="434.3" font-size="9.5" fill="#00f7ff" font-weight="bold" letter-spacing="2.4">STACK</text>
    <text x="26.0" y="454.8" font-size="9.5" fill="#00f7ff" opacity="0.85">Languages</text>
    <text x="40.0" y="466.3" font-size="9.5" fill="#e6f1f5" opacity="0.9">Python · Java · SQL · JavaScript</text>
    <text x="26.0" y="485.8" font-size="9.5" fill="#00f7ff" opacity="0.85">AI/ML</text>
    <text x="40.0" y="497.3" font-size="9.5" fill="#e6f1f5" opacity="0.9">PyTorch · TensorFlow · scikit-learn · OpenCV · spaCy</text>
    <text x="26.0" y="516.8" font-size="9.5" fill="#00f7ff" opacity="0.85">Systems</text>
    <text x="40.0" y="528.3" font-size="9.5" fill="#e6f1f5" opacity="0.9">Node.js · React · Docker · MongoDB · Firebase</text>
  </g>
</svg>
