name: refresh profile assets

on:
  schedule:
    # 04:17 UTC daily — off the hour, so it is not queued behind every other
    # cron job on GitHub's scheduler.
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "assets/source-photo.jpg"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade --quiet pillow

      - name: ASCII portrait
        run: |
          if [ -f assets/source-photo.jpg ]; then
            python scripts/gen_ascii.py
          else
            echo "::notice::assets/source-photo.jpg not present — skipping ASCII portrait"
          fi

      - name: Info card
        run: python scripts/gen_info_card.py

      - name: Contribution heatmap
        env:
          # GITHUB_TOKEN can usually read contributionsCollection. If it cannot
          # (see SETUP.md), add a classic PAT with `read:user` as the repository
          # secret GH_PAT and it is picked up here automatically.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/gen_heatmap.py

      - name: Commit regenerated assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          if git diff --cached --quiet; then
            echo "assets unchanged — nothing to commit"
          else
            git commit -m "chore: refresh profile assets [skip ci]"
            git push
          fi
